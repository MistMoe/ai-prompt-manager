spring.application.name=prompt-manager-backend

server.port=8080

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/prompt_manager?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s
sandbox.rate-limit=10
sandbox.window-ms=60000
security.jwt-secret=${JWT_SECRET:}
sandbox.models[0].id=deepseek-chat
sandbox.models[0].label=DeepSeek Chat
sandbox.models[0].model=deepseek-chat
sandbox.models[0].api-url=https://api.deepseek.com/chat/completions
sandbox.models[0].api-key=${DEEPSEEK_API_KEY:}
sandbox.models[1].id=deepseek-reasoner
sandbox.models[1].label=DeepSeek Reasoner
sandbox.models[1].model=deepseek-reasoner
sandbox.models[1].api-url=https://api.deepseek.com/chat/completions
sandbox.models[1].api-key=${DEEPSEEK_API_KEY:}
